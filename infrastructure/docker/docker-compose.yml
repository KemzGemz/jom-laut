# Local dev/CI infrastructure for Jom Laut.
# Brings up PostgreSQL, S3-compatible object storage (MinIO), and a dev mail sink.
#   docker compose -f infrastructure/docker/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jomlaut
      POSTGRES_PASSWORD: jomlaut
      POSTGRES_DB: jomlaut
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jomlaut']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  maildev:
    image: maildev/maildev:latest
    ports:
      - '1080:1080' # web UI
      - '1025:1025' # smtp

volumes:
  pgdata:
  miniodata:
