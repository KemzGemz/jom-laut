version: 1
applications:
  - appRoot: apps/customer-web
    frontend:
      # Install and build from the repository root, because this is a pnpm workspace.
      buildPath: '/'
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm install -g pnpm@11.17.0
            # Amplify needs a flat node_modules to package the Next.js server.
            # The web app needs none of the API's install scripts (Prisma, NestJS), so skipping them must not fail the build.
            - pnpm install --frozen-lockfile --config.node-linker=hoisted --config.strict-dep-builds=false --filter @jom-laut/customer-web...
        build:
          commands:
            # Run Next.js directly: "pnpm run" would first re-check dependencies with a full install, which fails here.
            - cd apps/customer-web && npx --no-install next build
      artifacts:
        baseDirectory: apps/customer-web/.next
        files:
          - '**/*'
      cache:
        paths:
          - apps/customer-web/.next/cache/**/*
